name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Type-check, Lint, Test Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin npm@11.6.2 to match lockfile format (Fase 6.7 decision: lockfile v3+ generated by npm 11.6.2;
      # if runner has npm 10.x, `npm ci` fails "Missing from lock file" due to algorithm mismatch).
      # MUST match "packageManager": "npm@11.6.2" in package.json.
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Pin npm 11.6.2
        run: npm install -g npm@11.6.2

      - name: Install dependencies (root)
        run: npm ci

      - name: Type-check (root)
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test coverage
        run: npm run test:coverage

      # MCP type-check with its own npm ci
      - name: Install dependencies (mcp)
        working-directory: mcp
        run: npm ci

      - name: Type-check (mcp)
        working-directory: mcp
        run: npm run type-check

      # Coverage artifact (always upload for visibility, but store 7 days)
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E Tests (Playwright + Supabase)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Pin npm 11.6.2
        run: npm install -g npm@11.6.2

      - name: Install dependencies (root)
        run: npm ci

      # Playwright browser cache by lockfile hash
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Supabase stack setup
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Start Supabase stack
        run: |
          supabase start --ignore-health-check
          sleep 10

      - name: Reset database with seed
        run: supabase db reset

      # Read dynamic credentials from ephemeral stack (not secrets — stack is local+transient)
      - name: Read Supabase credentials
        id: supabase
        run: |
          STATUS=$(supabase status -o json)
          echo "api_url=$(echo "$STATUS" | jq -r '.API_URL')" >> "$GITHUB_OUTPUT"
          echo "anon_key=$(echo "$STATUS" | jq -r '.ANON_KEY')" >> "$GITHUB_OUTPUT"

      # E2E tests with env vars from ephemeral stack
      - name: Run Playwright tests
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.api_url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon_key }}
        run: npx playwright test --project=chromium

      # Upload failure artifacts only (screenshots, traces)
      - name: Upload test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 14

      # Always cleanup Supabase
      - name: Stop Supabase stack
        if: always()
        run: supabase stop
